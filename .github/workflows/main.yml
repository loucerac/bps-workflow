name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
      - name: Lint
        run: pixi run lint
      - name: Formatting
        run: pixi run fmt-check
      - name: Workflow on the synthetic test delivery
        run: pixi run test-workflow
